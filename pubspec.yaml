name: nivara
description: A mental wellness platform connecting users with therapists, AI support, and community.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  go_router: ^17.0.0
  
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  flutter_secure_storage: ^10.0.0
  
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  dio: ^5.4.0
  connectivity_plus: ^7.0.0
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  logger: ^2.0.2+1
  flutter_phoenix: ^1.0.0
  
  intl: ^0.20.2
  
  fl_chart: ^1.1.0
  syncfusion_flutter_charts: ^31.1.19
  
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  
  flutter_tts: ^4.0.2
  speech_to_text: ^7.3.0
  
  cached_network_image: ^3.3.1
